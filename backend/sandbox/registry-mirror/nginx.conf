# Read-only npm and PyPI mirror proxy of the sandbox command containers (#25).
#
# The command and service containers (sandbox_run_command, sandbox_start_service)
# reach npm and PyPI through this proxy only: SANDBOX_REGISTRY_MIRROR_URL names it,
# its host is the one registry host in their egress allow-list, and the public
# registries are never listed there.
#
# Security boundary:
# - Reachable through it: GET and HEAD of npm package metadata and tarballs
#   (registry.npmjs.org), of the PyPI simple index (pypi.org/simple) and of the
#   PyPI distribution files (files.pythonhosted.org). Nothing else: every other
#   path answers 403.
# - Not reachable: any other method (npm publish, npm login, twine upload, an
#   audit POST all answer 403), any other upstream, any caller credential (the
#   Authorization and Cookie headers are dropped before the upstream; the proxy
#   holds no credential of its own).
# - The links the registries answer (npm dist.tarball, PyPI file URLs) are
#   rewritten to this proxy, so a client never follows one to the public host.
#
# Run it with a stock unprivileged nginx (nginxinc/nginx-unprivileged), this
# file mounted as /etc/nginx/nginx.conf, port 8080; the pod needs egress to the
# three upstream hosts and DNS, the sandboxes need egress to this proxy alone.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    # The upstream names, resolved at request time (Kubernetes DNS; override with the cluster resolver).
    resolver kube-dns.kube-system.svc.cluster.local valid=60s ipv6=off;
    resolver_timeout 5s;

    # The registries' links are rewritten in metadata, so the body must reach nginx uncompressed.
    sub_filter_types application/json application/vnd.npm.install-v1+json text/html
                     application/vnd.pypi.simple.v1+json application/vnd.pypi.simple.v1+html;
    sub_filter_once off;

    server {
        listen 8080;

        # Read-only: GET (and HEAD, which GET implies) only.
        location / {
            limit_except GET {
                deny all;
            }
            return 403;
        }

        location /healthz {
            limit_except GET {
                deny all;
            }
            access_log off;
            return 200 "ok\n";
        }

        location /npm/ {
            limit_except GET {
                deny all;
            }
            proxy_pass https://registry.npmjs.org/;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host registry.npmjs.org;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Accept-Encoding "";
            proxy_redirect https://registry.npmjs.org/ $scheme://$http_host/npm/;
            sub_filter "https://registry.npmjs.org/" "$scheme://$http_host/npm/";
        }

        location /pypi/simple/ {
            limit_except GET {
                deny all;
            }
            proxy_pass https://pypi.org/simple/;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host pypi.org;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Accept-Encoding "";
            proxy_redirect https://pypi.org/simple/ $scheme://$http_host/pypi/simple/;
            sub_filter "https://files.pythonhosted.org/" "$scheme://$http_host/pypi/files/";
        }

        location /pypi/files/ {
            limit_except GET {
                deny all;
            }
            proxy_pass https://files.pythonhosted.org/;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host files.pythonhosted.org;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
        }
    }
}
