# Read-only npm, PyPI and Maven Central mirror proxy of the sandbox command containers (#25, #1227).
#
# The command and service containers (sandbox_run_command, sandbox_start_service)
# reach npm, PyPI and Maven Central through this proxy only: SANDBOX_REGISTRY_MIRROR_URL names it,
# its host is the one registry host in their egress allow-list, and the public
# registries are never listed there.
#
# Security boundary:
# - Reachable through it: GET and HEAD of npm package metadata and tarballs
#   (registry.npmjs.org), of the PyPI simple index (pypi.org/simple) and of the
#   PyPI distribution files (files.pythonhosted.org) and of the Maven Central
#   artifacts and metadata (repo.maven.apache.org/maven2, under /maven/).
#   Nothing else: every other path answers 403.
# - The Maven route adds one upstream and no new capability: a build reads
#   released artifacts, it never deploys (mvn deploy is a PUT, refused here)
#   and reaches no other repository (the settings the platform writes mirror
#   every repository, mirrorOf *, to this route).
# - Not reachable: any other method (npm publish, npm login, twine upload, an
#   audit POST, mvn deploy all answer 403), any other upstream, any caller credential (the
#   Authorization and Cookie headers are dropped before the upstream; the proxy
#   holds no credential of its own).
# - The links the registries answer (npm dist.tarball, PyPI file URLs) are
#   rewritten to this proxy, so a client never follows one to the public host.
#
# Run it with a stock unprivileged nginx (nginxinc/nginx-unprivileged), this
# file mounted as /etc/nginx/nginx.conf, port 8080; the pod needs egress to the
# four upstream hosts and DNS, the sandboxes need egress to this proxy alone.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    # The upstream names, resolved at request time (Kubernetes DNS; override with the cluster resolver).
    # nginx uses the resolver only for a proxy_pass that holds a variable: each location below passes
    # to a variable host, so a registry's CDN addresses are re-read every 60 s and a name that does not
    # resolve at boot does not stop nginx from starting.
    resolver kube-dns.kube-system.svc.cluster.local valid=60s ipv6=off;
    resolver_timeout 5s;

    # The upstream path: the request URI as the client sent it (still percent-encoded, query string
    # kept, e.g. npm's /@scope%2fname), with the mirror prefix stripped.
    map $request_uri $npm_path {
        "~^/npm(?<rest>/.*)$" $rest;
        default /;
    }
    map $request_uri $pypi_simple_path {
        "~^/pypi/simple(?<rest>/.*)$" $rest;
        default /;
    }
    map $request_uri $pypi_files_path {
        "~^/pypi/files(?<rest>/.*)$" $rest;
        default /;
    }
    map $request_uri $maven_path {
        "~^/maven(?<rest>/.*)$" $rest;
        default /;
    }

    # The registries' links are rewritten in metadata, so the body must reach nginx uncompressed.
    sub_filter_types application/json application/vnd.npm.install-v1+json text/html
                     application/vnd.pypi.simple.v1+json application/vnd.pypi.simple.v1+html;
    sub_filter_once off;

    server {
        listen 8080;

        # Read-only: GET (and HEAD, which GET implies) only.
        location / {
            limit_except GET {
                deny all;
            }
            return 403;
        }

        location /healthz {
            limit_except GET {
                deny all;
            }
            access_log off;
            return 200 "ok\n";
        }

        location /npm/ {
            limit_except GET {
                deny all;
            }
            set $npm_upstream registry.npmjs.org;
            proxy_pass https://$npm_upstream$npm_path;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host registry.npmjs.org;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Accept-Encoding "";
            proxy_redirect https://registry.npmjs.org/ $scheme://$http_host/npm/;
            sub_filter "https://registry.npmjs.org/" "$scheme://$http_host/npm/";
        }

        location /pypi/simple/ {
            limit_except GET {
                deny all;
            }
            set $pypi_upstream pypi.org;
            proxy_pass https://$pypi_upstream/simple$pypi_simple_path;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host pypi.org;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Accept-Encoding "";
            proxy_redirect https://pypi.org/simple/ $scheme://$http_host/pypi/simple/;
            sub_filter "https://files.pythonhosted.org/" "$scheme://$http_host/pypi/files/";
        }

        location /pypi/files/ {
            limit_except GET {
                deny all;
            }
            set $files_upstream files.pythonhosted.org;
            proxy_pass https://$files_upstream$pypi_files_path;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host files.pythonhosted.org;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
        }

        # Maven Central: artifacts, POMs, checksums and maven-metadata.xml; no link to rewrite.
        location /maven/ {
            limit_except GET {
                deny all;
            }
            set $maven_upstream repo.maven.apache.org;
            proxy_pass https://$maven_upstream/maven2$maven_path;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host repo.maven.apache.org;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
        }
    }
}
