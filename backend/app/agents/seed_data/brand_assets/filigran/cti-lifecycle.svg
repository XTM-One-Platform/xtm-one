<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A1E" />
      <stop offset="1" stop-color="#0A1226" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0FBCFF" />
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00F0BC" />
    </marker>
  </defs>

  <rect width="1600" height="780" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="1598" height="778" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />

  <text x="80" y="96" font-size="22" font-weight="700" letter-spacing="6" fill="#0FBCFF">THE INTELLIGENCE LIFECYCLE</text>
  <text x="80" y="140" font-size="26" fill="#FFFFFF" fill-opacity="0.6">Six phases, one loop - every product starts and ends with a question.</text>

  
  <g>
    <rect x="80" y="220" width="264" height="240" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#0FBCFF" stroke-opacity="0.55" stroke-width="2" />
    <rect x="80" y="220" width="264" height="6" rx="3" fill="#0FBCFF" />
    <circle cx="124" cy="286" r="26" fill="#0FBCFF" />
    <text x="124" y="297" font-size="30" font-weight="700" text-anchor="middle" fill="#050A1E">1</text>
    <text x="104" y="366" font-size="30" font-weight="600" fill="#FFFFFF">Direction</text>
    <text x="104" y="404" font-size="21" fill="#FFFFFF" fill-opacity="0.55">Agree on the questions</text>
    <text x="104" y="432" font-size="21" fill="#FFFFFF" fill-opacity="0.55">and who is asking them</text>
  </g>
  <line x1="344" y1="340" x2="386" y2="340" stroke="#0FBCFF" stroke-width="3" marker-end="url(#arrow)" />

  
  <g>
    <rect x="392" y="220" width="264" height="240" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    <circle cx="436" cy="286" r="26" fill="#0FBCFF" fill-opacity="0.16" stroke="#0FBCFF" stroke-width="2" />
    <text x="436" y="296" font-size="28" font-weight="700" text-anchor="middle" fill="#0FBCFF">2</text>
    <text x="416" y="366" font-size="30" font-weight="600" fill="#FFFFFF">Collection</text>
    <text x="416" y="404" font-size="21" fill="#FFFFFF" fill-opacity="0.55">OSINT, feeds, ISACs,</text>
    <text x="416" y="432" font-size="21" fill="#FFFFFF" fill-opacity="0.55">internal telemetry</text>
  </g>
  <line x1="656" y1="340" x2="698" y2="340" stroke="#0FBCFF" stroke-width="3" marker-end="url(#arrow)" />

  
  <g>
    <rect x="704" y="220" width="264" height="240" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    <circle cx="748" cy="286" r="26" fill="#0FBCFF" fill-opacity="0.16" stroke="#0FBCFF" stroke-width="2" />
    <text x="748" y="296" font-size="28" font-weight="700" text-anchor="middle" fill="#0FBCFF">3</text>
    <text x="728" y="366" font-size="30" font-weight="600" fill="#FFFFFF">Processing</text>
    <text x="728" y="404" font-size="21" fill="#FFFFFF" fill-opacity="0.55">Normalize and structure</text>
    <text x="728" y="432" font-size="21" fill="#FFFFFF" fill-opacity="0.55">(this is where STIX lives)</text>
  </g>
  <line x1="968" y1="340" x2="1010" y2="340" stroke="#0FBCFF" stroke-width="3" marker-end="url(#arrow)" />

  
  <g>
    <rect x="1016" y="220" width="264" height="240" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    <circle cx="1060" cy="286" r="26" fill="#0FBCFF" fill-opacity="0.16" stroke="#0FBCFF" stroke-width="2" />
    <text x="1060" y="296" font-size="28" font-weight="700" text-anchor="middle" fill="#0FBCFF">4</text>
    <text x="1040" y="366" font-size="30" font-weight="600" fill="#FFFFFF">Analysis</text>
    <text x="1040" y="404" font-size="21" fill="#FFFFFF" fill-opacity="0.55">Judgment against the</text>
    <text x="1040" y="432" font-size="21" fill="#FFFFFF" fill-opacity="0.55">question - the human core</text>
  </g>
  <line x1="1280" y1="340" x2="1322" y2="340" stroke="#0FBCFF" stroke-width="3" marker-end="url(#arrow)" />

  
  <g>
    <rect x="1328" y="220" width="192" height="240" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    <circle cx="1372" cy="286" r="26" fill="#0FBCFF" fill-opacity="0.16" stroke="#0FBCFF" stroke-width="2" />
    <text x="1372" y="296" font-size="28" font-weight="700" text-anchor="middle" fill="#0FBCFF">5</text>
    <text x="1352" y="366" font-size="28" font-weight="600" fill="#FFFFFF">Dissemi-</text>
    <text x="1352" y="400" font-size="28" font-weight="600" fill="#FFFFFF">nation</text>
    <text x="1352" y="436" font-size="21" fill="#FFFFFF" fill-opacity="0.55">Right form, right</text>
    <text x="1352" y="462" font-size="21" fill="#FFFFFF" fill-opacity="0.55" transform="translate(0,-4)">audience</text>
  </g>

  
  <path d="M1424 460 L1424 596 Q1424 620 1400 620 L236 620 Q212 620 212 596 L212 472" fill="none" stroke="#00F0BC" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowSoft)" />
  <rect x="632" y="588" width="336" height="64" rx="32" fill="#00F0BC" fill-opacity="0.1" stroke="#00F0BC" stroke-opacity="0.5" stroke-width="2" />
  <text x="800" y="629" font-size="24" font-weight="600" text-anchor="middle" fill="#00F0BC">6 · Feedback: did it help?</text>
  <text x="800" y="700" font-size="21" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.5">The answer reshapes the requirements - and the cycle repeats.</text>
</svg>