<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A1E" />
      <stop offset="1" stop-color="#0A1226" />
    </linearGradient>
    <marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#FCA55D" />
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00F0BC" />
    </marker>
  </defs>

  <rect width="1600" height="780" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="1598" height="778" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />

  <text x="80" y="96" font-size="22" font-weight="700" letter-spacing="6" fill="#FCA55D">THE PICERL LOOP</text>
  <text x="80" y="140" font-size="26" fill="#FFFFFF" fill-opacity="0.6">Six phases from SANS - drawn as a loop because the last phase feeds the first.</text>

  
  <g>
    <rect x="80" y="220" width="256" height="240" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#FCA55D" stroke-opacity="0.6" stroke-width="2" />
    <rect x="80" y="220" width="256" height="6" rx="3" fill="#FCA55D" />
    <circle cx="124" cy="286" r="26" fill="#FCA55D" />
    <text x="124" y="297" font-size="30" font-weight="700" text-anchor="middle" fill="#050A1E">P</text>
    <text x="104" y="366" font-size="29" font-weight="600" fill="#FFFFFF">Preparation</text>
    <text x="104" y="404" font-size="21" fill="#FFFFFF" fill-opacity="0.55">Plans, roles, access,</text>
    <text x="104" y="432" font-size="21" fill="#FFFFFF" fill-opacity="0.55">practiced before day zero</text>
  </g>
  <line x1="336" y1="340" x2="376" y2="340" stroke="#FCA55D" stroke-width="3" marker-end="url(#arrowO)" />

  
  <g>
    <rect x="382" y="220" width="256" height="240" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    <circle cx="426" cy="286" r="26" fill="#FCA55D" fill-opacity="0.16" stroke="#FCA55D" stroke-width="2" />
    <text x="426" y="296" font-size="28" font-weight="700" text-anchor="middle" fill="#FCA55D">I</text>
    <text x="406" y="366" font-size="29" font-weight="600" fill="#FFFFFF">Identification</text>
    <text x="406" y="404" font-size="21" fill="#FFFFFF" fill-opacity="0.55">Is this real? What is</text>
    <text x="406" y="432" font-size="21" fill="#FFFFFF" fill-opacity="0.55">its scope and severity?</text>
  </g>
  <line x1="638" y1="340" x2="678" y2="340" stroke="#FCA55D" stroke-width="3" marker-end="url(#arrowO)" />

  
  <g>
    <rect x="684" y="220" width="256" height="240" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    <circle cx="728" cy="286" r="26" fill="#FCA55D" fill-opacity="0.16" stroke="#FCA55D" stroke-width="2" />
    <text x="728" y="296" font-size="28" font-weight="700" text-anchor="middle" fill="#FCA55D">C</text>
    <text x="708" y="366" font-size="29" font-weight="600" fill="#FFFFFF">Containment</text>
    <text x="708" y="404" font-size="21" fill="#FFFFFF" fill-opacity="0.55">Stop the spread without</text>
    <text x="708" y="432" font-size="21" fill="#FFFFFF" fill-opacity="0.55">destroying evidence</text>
  </g>
  <line x1="940" y1="340" x2="980" y2="340" stroke="#FCA55D" stroke-width="3" marker-end="url(#arrowO)" />

  
  <g>
    <rect x="986" y="220" width="256" height="240" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    <circle cx="1030" cy="286" r="26" fill="#FCA55D" fill-opacity="0.16" stroke="#FCA55D" stroke-width="2" />
    <text x="1030" y="296" font-size="24" font-weight="700" text-anchor="middle" fill="#FCA55D">E·R</text>
    <text x="1010" y="360" font-size="29" font-weight="600" fill="#FFFFFF">Eradication</text>
    <text x="1010" y="396" font-size="29" font-weight="600" fill="#FFFFFF">&amp; recovery</text>
    <text x="1010" y="434" font-size="21" fill="#FFFFFF" fill-opacity="0.55">Remove access, restore,</text>
    <text x="1010" y="460" font-size="21" fill="#FFFFFF" fill-opacity="0.55" transform="translate(0,-4)">watch for re-entry</text>
  </g>
  <line x1="1242" y1="340" x2="1282" y2="340" stroke="#FCA55D" stroke-width="3" marker-end="url(#arrowO)" />

  
  <g>
    <rect x="1288" y="220" width="232" height="240" rx="10" fill="#00F0BC" fill-opacity="0.05" stroke="#00F0BC" stroke-opacity="0.55" stroke-width="2" />
    <circle cx="1332" cy="286" r="26" fill="#00F0BC" fill-opacity="0.16" stroke="#00F0BC" stroke-width="2" />
    <text x="1332" y="296" font-size="28" font-weight="700" text-anchor="middle" fill="#00F0BC">L</text>
    <text x="1312" y="360" font-size="29" font-weight="600" fill="#FFFFFF">Lessons</text>
    <text x="1312" y="396" font-size="29" font-weight="600" fill="#FFFFFF">learned</text>
    <text x="1312" y="434" font-size="21" fill="#FFFFFF" fill-opacity="0.55">Blameless review:</text>
    <text x="1312" y="460" font-size="21" fill="#FFFFFF" fill-opacity="0.55" transform="translate(0,-4)">what must change?</text>
  </g>

  
  <path d="M1404 460 L1404 596 Q1404 620 1380 620 L232 620 Q208 620 208 596 L208 472" fill="none" stroke="#00F0BC" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowT)" />
  <rect x="560" y="588" width="480" height="64" rx="32" fill="#00F0BC" fill-opacity="0.1" stroke="#00F0BC" stroke-opacity="0.5" stroke-width="2" />
  <text x="800" y="629" font-size="24" font-weight="600" text-anchor="middle" fill="#00F0BC">Close the loop: update detections and intel</text>
  <text x="800" y="700" font-size="21" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.5">An incident you learned nothing from is one you will respond to again.</text>
</svg>