# The checks an agent may run on a checkout of this repository in the sandbox
# (sandbox_run_command(check="<name>")). One table per check: argv (no shell),
# cwd relative to the checkout root, timeout in seconds, image key of the
# sandbox image that carries the tools (OPENSANDBOX_IMAGES: python-dev and
# nodejs-dev are built from backend/sandbox/Dockerfile.sandbox.dev with the
# repository's locked dependencies), report = "junit" | "sarif" | "lines" and
# report_path, the file the check writes (relative to cwd), default_args, the
# arguments that end argv when a call gives none (a call's args replace them,
# so a linter's default target is not linted next to the named file). The sandbox has no
# network: a check that needs an install fails with a connection error.
#
# [service.<name>] tables declare how the repository runs from a checkout
# (sandbox_start_service): argv, cwd, image, port, ready_path, ready_log (a
# text its output must hold before it counts ready), timeout (to
# readiness), lifetime (after the last call), env, depends_on (started
# first in the same container) and needs (the repository paths the service
# reads: a start on a narrow checkout without one of them is refused, naming
# the materialize_repository add_paths call that adds them). See
# dev-docs/reference/sandbox-workspace.md.

# The lab: the whole product from this checkout (PostgreSQL + pgvector, a
# Redis-API store, an S3 store, a stub model, the backend with its migrations
# and seeded administrator, the Vite dev server), for a look at a change in the
# browser. Throwaway credentials, valid only inside the lab. LAB_THEME =
# "light" (or "dark") in env opens every session in that theme: [service.lab-light]
# below is this lab in light, for a light-theme review in one call. Language: open
# /api/v1/lab/locale/<en|fr|es|ja|default>?next=<path> on the preview (every user of the lab, #1653), or set
# LAB_LOCALE in env for the seeded identities.
# Every lab seeds an upcoming and a missed scheduled one-off owned by a member of
# "Lab sample fleet", so the Reschedule dialog opens with no override (log lines
# "seeded scheduled one-off: <url>" and "seeded scheduled one-off (missed): <url>", #11252).
# dev-docs/reference/agentic-labs.md, "The xtm-one lab".
[service.lab]
description = "xtm-one from this checkout: sign in as lab@filigran.io / lab-only-password"
argv = ["python", ".xtm-one/lab/lab.py"]
port = 3100
image = "python-dev"
ready_path = "/"
ready_log = "lab up: "
session_log = "seeded signed-in session"
needs = [".xtm-one/lab", ".xtm-one/stores.py", "backend", "frontend"]
timeout = 280
# A restart in place keeps the toolchain and the frontend install (yarn.lock unchanged): the backend boot,
# migrations and seed only (#12236).
restart_target = 120
lifetime = 7200
env = { ADMIN_EMAIL = "lab@filigran.io", ADMIN_PASSWORD = "lab-only-password", SECRET_KEY = "lab-only-secret-key-never-used-outside-the-lab", PLATFORM_MODE = "xtm_one", ENABLED_FEATURES = "*" }

# The same lab with LAB_THEME = "light": the theme preference of the administrator
# and of the peer is light before their signed-in links print, so the first load
# and every reload of either session paint light on every layer with no
