# The live half of the OOTB routing eval (dev-docs/ootb-routing-eval.md): the golden tasks replayed on a
# running lab through its chat API. It reaches the lab only from inside it, so it runs with
# sandbox_run_command(check="lab-routing-eval", service_id=<the lab>) after sandbox_start_service
# lab-ootb-live (a check container has no route to a lab pod). The lab's throwaway sign-in; args replace
# the default task filter (--task TEXT, --surface NAME, --out PATH, repeatable).
[check.lab-routing-eval]
description = "OOTB routing eval on a running lab: run with service_id = the lab-ootb-live lab; args: --task TEXT (a golden task label, e.g. 'summarize a report', or a piece of its prompt; case-insensitive), --surface NAME, --entry SLUG (ask the tasks of that agent directly, no handover expected), --expect-format html|markdown (html: the answer must carry HTML tags; markdown, the default rule: none), --out PATH, --wait SECONDS, --task-timeout SECONDS (default 150: a longer turn is a timed_out row, the next task runs), --confirm TEXT (a second turn in the same conversation once the first answered, e.g. 'Build it as it is.'), --verify (read the OpenCTI dashboard the task names back through the lab's OpenCTI GraphQL: verified true/false, dashboard_id, widgets; --verify-wait SECONDS, default 90) (exit 2: the lab's OpenCTI not registered yet, run again; exit 3: the lab's LLM proxy key is over its quota, resets at the UTC time printed; exit 5: no golden task matches --task / --surface, nothing asked, the labels printed)"
argv = ["python", ".xtm-one/lab/routing_eval.py", "--base", "http://127.0.0.1:8100", "--email", "lab@filigran.io", "--password", "lab-only-password"]
default_args = ["--task", "create an OpenCTI dashboard from XTM One"]
timeout = 270
image = "python-dev"

# The table the last lab-routing-eval run kept in the lab's copy (.xtm/routing-eval/last.json, rewritten after
# each task), read back with no task asked and no LLM call: a calling turn handed back mid-call reads it here.
[check.lab-routing-eval-last]
description = "The table of the last lab-routing-eval run in this lab, no LLM call: run with service_id = the same lab (exit 1: that run stopped mid-way, its finished tasks listed; exit 4: no table kept)"
argv = ["python", ".xtm-one/lab/routing_eval.py", "--last"]
timeout = 30
image = "python-dev"

# The lab model key's LLM proxy quota usage (GET /v1/quota on the proxy), no completion asked: run it before
# and after a step to prove that step spent no LLM call (equal counts) or one (the count grows).
[check.lab-model-quota]
