[service.lab-opencti-search]
description = "the search engine of the lab's OpenCTI"
argv = ["sh", "-c", "exec /usr/share/opensearch/opensearch-docker-entrypoint.sh -Ediscovery.type=single-node"]
port = 9200
image = "opencti-search"
timeout = 600
env = { DISABLE_SECURITY_PLUGIN = "true", DISABLE_INSTALL_DEMO_CONFIG = "true", OPENSEARCH_JAVA_OPTS = "-Xms1g -Xmx1g" }

[service.lab-opencti-broker]
description = "the message broker of the lab's OpenCTI"
argv = ["rabbitmq-server"]
port = 5672
image = "opencti-broker"
timeout = 600

[service.lab-opencti-redis]
description = "the Redis of the lab's OpenCTI (6380: the lab's own store holds 6379)"
# No persistence: the working directory is the read-only checkout, so an RDB snapshot fails and Redis then
# refuses every write (MISCONF): OpenCTI's manager locks fail and its XTM One registration never retries.
argv = ["sh", "-c", "exec redis-server --port 6380 --bind 127.0.0.1 --save '' --appendonly no"]
port = 6380
image = "opencti-redis"

[service.lab-opencti-s3]
description = "the S3 store of the lab's OpenCTI (9002: the lab's own store holds 9000)"
# The S3 binary is "silo" on pgsty/silo (the image OpenCTI's own compose runs) and "minio" on minio/minio.
argv = ["sh", "-c", "exec \"$(command -v silo || command -v minio)\" server /tmp/opencti-s3 --address 127.0.0.1:9002 --console-address 127.0.0.1:9003"]
port = 9002
image = "opencti-s3"
env = { MINIO_ROOT_USER = "opencti", MINIO_ROOT_PASSWORD = "lab-only-opencti-s3" }

[service.lab-opencti]
description = "the lab's OpenCTI, registered with the lab's XTM One backend"
# A product image gets no harness port wait (labs.py service_script) and OpenCTI checks its
# dependencies once then exits: .xtm-one/lab/opencti-start.sh waits for each depends_on port, for the
# search cluster at yellow and for a Redis write (a fresh OpenSearch or Redis answers on its port
# before it serves, and the first-start initialisation then exits with code 1), generates the
# per-start app:encryption_key OpenCTI 7.x needs, and logs node's exit code with its cause.
argv = ["sh", ".xtm-one/lab/opencti-start.sh"]
port = 4000
image = "opencti"
ready_path = "/health?health_access_key=lab-only-opencti-health"
timeout = 900
depends_on = ["lab-opencti-search", "lab-opencti-broker", "lab-opencti-redis", "lab-opencti-s3"]
env = { NODE_OPTIONS = "--max-old-space-size=4096", APP__APP_LOGS__LOGS_LEVEL = "debug", APP__PORT = "4000", APP__BASE_URL = "http://localhost:4000", APP__HEALTH_ACCESS_KEY = "lab-only-opencti-health", APP__ADMIN__EMAIL = "lab@filigran.io", APP__ADMIN__PASSWORD = "lab-only-password", APP__ADMIN__TOKEN = "00000000-0000-4000-8000-000000000001", ELASTICSEARCH__URL = "http://localhost:9200", RABBITMQ__HOSTNAME = "localhost", RABBITMQ__PORT = "5672", RABBITMQ__USERNAME = "guest", RABBITMQ__PASSWORD = "guest", REDIS__HOSTNAME = "localhost", REDIS__PORT = "6380", MINIO__ENDPOINT = "localhost", MINIO__PORT = "9002", MINIO__USE_SSL = "false", MINIO__ACCESS_KEY = "opencti", MINIO__SECRET_KEY = "lab-only-opencti-s3", XTM__XTM_ONE_URL = "http://localhost:8100", XTM__XTM_ONE_TOKEN = "lab-only-registration-token-never-used-outside-the-lab" }

# OpenCTI's Ask Ariane panel rendered in OpenCTI's own front (chat-layout program, xtm-one #10910): the
# lab's OpenCTI above answers GraphQL and an OpenCTI front built from a nested checkout serves the UI.
# Before the start: materialize_repository(OpenCTI-Platform/opencti, ref=<branch or master>, sub_paths =
# OPENCTI_SUB_PATHS of .xtm-one/lab/opencti_ask_ariane.py, path="<this checkout>/opencti"), at the tag of the
# opencti image key (7.261106.0 today; master's front queries fields that image lacks). /chatbot/* is
# answered by the script from fixtures (agents, two seeded conversations, a long Markdown answer streamed
# in chunks, "slow" holds the working state, "error" ends on an error frame), so no XTM One is needed. To
# render a @filigran/* release that tag does not pin (a chatbot bump PR on master), write opencti-pins.json at
# this checkout's root ({"@filigran/chatbot": "3.25.0", "@filigran/design-system": "1.5.0"}) or set
# LAB_OPENCTI_PINS: the script rewrites the front's pins and yarn resolves the lock ("front pins overridden"). To
# render a HOST change of master or a PR head (Ask Ariane panel, Theme*.ts, fds-tokens.generated.ts) on that tag
# front, materialize the ref a second time with HOST_PATHS of the script under <this checkout>/opencti-host: the
# script copies them over the tag checkout before the install ("host files from <repo>@<commit> (<ref>) overlaid"). The
# start log names the seeded conversations ("seeded Ask Ariane conversation: <url>"). Heavy (about 6 GB,
# the five OpenCTI image keys), started only on purpose.
[service.lab-opencti-ask-ariane]
description = "OpenCTI's front from a nested opencti/ checkout with the Ask Ariane panel answering from fixtures: sign in as lab@filigran.io / lab-only-password"
argv = ["python", ".xtm-one/lab/opencti_ask_ariane.py"]
port = 3200
image = "python-dev"
ready_path = "/chatbot/config"
ready_log = "lab up: "
session_log = "seeded signed-in session"
needs = [".xtm-one/lab"]
timeout = 900
lifetime = 7200
depends_on = ["lab-opencti"]

# OpenCTI at a PR head, backend AND front from the same nested checkout (xtm-one #11862): the release-tag lab above
# renders a master PR head blank (its front queries fields the tag's backend lacks). Before the start:
# materialize_repository(OpenCTI-Platform/opencti, ref=<the PR head>, sub_paths = SUB_PATHS of
# .xtm-one/lab/opencti_pr_head.py, path="<this checkout>/opencti"). The script installs both workspaces, writes the
# connectors manifest, runs graphql-codegen and the esbuild development build, starts the backend on 4100 against
# the lab's OpenSearch, RabbitMQ, Redis and S3 under its own prefixes (migrations run at boot), compiles Relay and
# serves the front through a proxy that signs every request in as the lab admin. It seeds a label, a vocabulary
# entry and one filled and one empty Organization, Individual, Sector, System, Malware, Indicator and Report; the
# start answer lists their pages ("seeded opencti page <label>: <url>"). A PR adds its own seed in
# opencti-lab-seed.json at this checkout's root: GraphQL entries, a playbook, or {label, script, path?} naming the PR's
# own .mjs/.js seed, run with the lab's pinned node (OPENCTI_URL, OPENCTI_TOKEN in its environment). Theme: /lab/theme/dark or /lab/theme/light (?next=<path>). Heavy
# (the four OpenCTI store image keys, a full backend build), started only on purpose.
[service.lab-opencti-pr-head]
description = "OpenCTI's backend and front built from a nested opencti/ checkout at a PR head, seeded, every page signed in as the lab admin"
argv = ["python", ".xtm-one/lab/opencti_pr_head.py"]
port = 3500
# toolchain-node, not python-dev: OpenCTI's backend links a native module (node-calls-python) that node-gyp
# compiles with make and a C++ compiler, which only the toolchain images carry.
image = "toolchain-node"
ready_path = "/lab/ready"
ready_log = "lab up: "
session_log = "seeded opencti page"
needs = [".xtm-one/lab"]
timeout = 900
lifetime = 7200
depends_on = ["lab-opencti-search", "lab-opencti-broker", "lab-opencti-redis", "lab-opencti-s3"]

