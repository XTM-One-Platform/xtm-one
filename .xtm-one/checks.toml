# opencti-search, opencti-broker, opencti-redis, opencti-s3; ports apart from the lab's stores).
# The OpenCTI holds the lab's registration token and registers itself with the lab's backend
# (LAB_OPENCTI = "live": the seed skips its .invalid OpenCTI row and waits for the real one; the
# log line "seeded live OpenCTI integration: <url>"). The runner of #10169 then replays the golden
# tasks: dev-docs/ootb-routing-eval.md, "The live half (lab)". On a platform without the five
# image keys the start is refused with the key named; heavy (about 6 GB), started only on purpose.
# LAB_WORKER = "1" runs the SAQ worker beside the backend (its reconciler claims the delegated background
# tasks, e.g. the Dashboard Creator's widget tasks; without it they stay queued, #11023).
[service.lab-ootb-live]
description = "xtm-one with a live model and an OpenCTI of its own registered through the real path (OOTB routing eval): sign in as lab@filigran.io / lab-only-password"
argv = ["python", ".xtm-one/lab/lab.py"]
port = 3100
image = "python-dev"
