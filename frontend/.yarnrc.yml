# Yarn Berry configuration — supply-chain hardening
# https://yarnpkg.com/configuration/yarnrc

# Use pinned versions (no ^ or ~ prefix when running yarn add)
defaultSemverRangePrefix: ""

# Use traditional node_modules layout for maximum compatibility
nodeLinker: node-modules

# --- Supply-chain security ---

# Disable all lifecycle scripts by default (postinstall, preinstall, etc.)
# Required scripts must be explicitly allowed via dependenciesMeta in package.json
enableScripts: false

# Reject packages published less than 3 days ago (4320 minutes).
# Gives the community time to flag compromised releases before we pull them.
npmMinimalAgeGate: 4320

# Packages exempt from the age gate (e.g. internal/scoped packages)
npmPreapprovedPackages:
  - "@filigran/*"
