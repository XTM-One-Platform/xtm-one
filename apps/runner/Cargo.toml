[package]
# The crate / binary keep the historical name on purpose: it is the identity
# the installed fleet self-updates under, the bare-archive file name every
# instance serves, and the CLI a headless server runs (`xtm-one-runner run`).
# The PRODUCT is XTM One Desktop (tauri.conf.json `productName`) -
name = "xtm-one-runner"
version = "0.0.0-dev"
edition = "2021"
rust-version = "1.90"
description = "XTM One Desktop - native chat client + pull-based OS-control runner (headless daemon on servers)"
license = "LicenseRef-XTM-One-Enterprise-Edition"
repository = "https://github.com/XTM-One-Platform/xtm-one"
publish = false
default-run = "xtm-one-runner"

# Standalone crate: declare its own workspace so cargo does not try to attach it
# to a parent workspace (the repo root is not a Cargo workspace).
[workspace]

[[bin]]
name = "xtm-one-runner"
path = "src/main.rs"

[features]
# The shell + file-ops core is always built; everything else is a feature, and
# the feature set is what makes a build DEPLOYABLE on a given host.
# `desktop` is the full-desktop capability set: genuine screenshots (xcap) and
# synthetic mouse/keyboard input (enigo). It is also the entire reason the
# desktop build cannot run on a server: xcap links libxcb + libdbus and enigo
# links libxkbcommon, all resolved by the loader BEFORE main() - no CLI flag
# can work around a missing .so. Dropping it leaves shell, file ops and
# browser control, and a binary with no desktop stack to link.
# `browser` adds real-browser control over CDP (chromiumoxide); enabled by
# default because the Fidelity audit MVP drives an authenticated browser.
# `self-update` adds the signature-verified download + binary-swap applier
# (download archive + .sha256 + .minisig, verify, extract, self-replace,
# re-exec) for the bare-binary / service / MDM install path. Availability
# CHECKING is always compiled; only APPLYING an update needs this feature.
# `gui` builds XTM One Desktop, the native app: the chat window that
# hosts the enrolled instance's web app, the tray icon, the connection panel
# (onboarding / overview / settings), the global shortcut, native installers,
# and the OS-native bundle updater. It implies `desktop`: a client whose agent
# cannot act on the machine it runs on is not the product.
#
# The two shipped flavors:
#   desktop  (default)                                  -> installers + GUI
#   headless (--no-default-features -f browser,self-update) -> servers, no X11
default = ["browser", "desktop", "self-update", "gui"]
browser = ["dep:chromiumoxide"]
desktop = ["dep:xcap", "dep:enigo", "dep:image"]
self-update = [
    "agent-core/self-update",
    "dep:base64",
    "dep:self-replace",
]
gui = [
    "desktop",
    "dep:tauri",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-global-shortcut",
]

[dependencies]
# What the runner shares with the relay (`apps/relay`): credential storage, the
# retry policy, the machine identity and the release verification.
agent-core = { path = "../agent-core" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "process",
    "fs",
    "io-util",
    "sync",
    "signal",
] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
url = "2"
hostname = "0.4"
sysinfo = "0.33"
iana-time-zone = "0.1"
sys-locale = "0.3"
sha2 = "0.10"
hex = "0.4"

# Full-desktop capture + synthetic input (feature = "desktop"). Optional so the
# headless flavor links none of the X11 / Wayland / D-Bus stack these pull in.
image = { version = "0.25", default-features = false, features = [
    "png",
], optional = true }
xcap = { version = "0.4", optional = true }
# `x11rb` instead of enigo's default `xdo` backend: the xdo backend puts a
# DT_NEEDED on libxdo.so.3, which ships in Ubuntu *universe* (package
# `libxdo3`) and is installed on no desktop that has not installed xdotool by
# hand - so the loader killed the runner before main() on a perfectly ordinary
# Ubuntu 26.04 desktop. x11rb speaks the X11 XTEST protocol from pure Rust over
# the display socket, so there is no extra .so to resolve at load time and
# nothing for a user to apt-install; the backend is selected at compile time
# (enigo's linux/mod.rs prefers x11rb over xdo) and implements the same
# Keyboard/Mouse traits `capabilities::input` drives. The one thing it does
# NOT implement is `fast_text`, so `Keyboard::text` falls back to one XTEST
# round trip per character (with enigo's 12 ms same-keycode delay) instead of
# libxdo's batched C loop - slower on a long `type` action, same result.
enigo = { version = "0.3", optional = true, default-features = false, features = [
    "x11rb",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Real-browser control over the Chrome DevTools Protocol (feature = "browser").
chromiumoxide = { version = "0.7", default-features = false, features = [
    "tokio-runtime",
], optional = true }

# Native desktop app (feature = "gui"). Tauri v2 gives us the chat window (a
# webview hosting the instance's web app), the tray icon, the connection
# panel, OS-native installers (NSIS / dmg / deb / rpm / AppImage) and the
# signed bundle updater. All optional so a headless build never pulls the
# webview stack. `dynamic-acl` (a Tauri default feature, listed explicitly
# because the chat window depends on it) is what lets the app grant the
# enrolled instance's origin - known only at enrollment time - a runtime IPC
# capability instead of a build-time one.
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    "dynamic-acl",
], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
# Summon the chat window from anywhere (Ctrl+Alt+Space), like Claude Desktop's
# quick entry.
tauri-plugin-global-shortcut = { version = "2", optional = true }

# Signature-verified self-update (feature = "self-update"). All pure-Rust so the
# daemon cross-compiles without a C toolchain: agent-core's `self-update`
# feature checks the detached .minisig against the compiled-in public key
# (minisign-verify) and unpacks the release archive (zip + tar + flate2, gzip
# on the miniz_oxide backend); self-replace swaps the running executable
# atomically across platforms.
base64 = { version = "0.22", optional = true }
self-replace = { version = "1", optional = true }

# OS-native credential storage (DPAPI / Keychain / libsecret) - one backend per
# platform so Windows never pulls the Linux secret-service stack, etc.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Re-attach the parent console for CLI subcommands (the binary is a windowless
# GUI app on Windows; see `attach_parent_console` in main.rs), tell a drive
# mapped to a network share from a link onto one (`local_paths.rs`), and read
# the browsers' RemoteDebuggingAllowed policy (`capabilities::browser`), and
# read the input desktop so `computer_action` refuses input a locked session
# would drop (`capabilities::input`).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK so opening a path a FIFO was swapped onto returns instead of
# blocking, and F_GETPATH (macOS) to name an open handle: a confined file
# operation confirms it resolved inside the allowed folders from the handle
# itself (`capabilities::files`). Pure FFI, so the daemon still
# cross-compiles without a C toolchain.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Tauri's build step: processes tauri.conf.json, embeds the app icon + Windows
# manifest, and prepares `generate_context!`. Runs whether or not the `gui`
# feature is on (it only reads config); the GUI code behind it is feature-gated.
# 2.7 is the first release that decides the static link of the Visual C++
# runtime itself (`WindowsAttributes::static_vc_runtime`, see build.rs): the
# Tauri CLI stopped asking for it in 2.12.
[build-dependencies]
tauri-build = { version = "2.7", features = [] }

# The transport's retry tests run on tokio's paused clock (`test-util`) and
# answer the real HTTP client from a local socket (`net`). Both are features of
# the tokio already in the graph, not a new crate.
[dev-dependencies]
tokio = { version = "1", features = ["test-util", "net"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
