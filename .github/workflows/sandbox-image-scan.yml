name: Scan sandbox image (on demand)

on:
  workflow_dispatch:
    inputs:
      image:
        description: >-
          Image to scan. Either a Docker-Hub-published reference
          (e.g. xtmone/sandbox-python:0.4), pulled directly, or a local-only
          image from backend/sandbox/sandbox-images.json with any tag (e.g.
          sandbox-python-network:scan), which is built first since it has no
          registry copy.
        required: true
        default: "sandbox-python:scan"

permissions:
  contents: read

jobs:
  scan:
    name: Trivy scan (${{ inputs.image }})
    runs-on: ubuntu-26.04
    # No gating anywhere in this job: this workflow only ever runs on
    # workflow_dispatch, is never called from the sandbox publish
    # (build-push-sandbox.yml in XTM-One-Platform/release), and its own scan
    # step always exits 0 — vulnerability scanning is a manually triggered,
    # non-blocking check (spec FR-007/FR-008), not a build gate.
    steps:
      - uses: actions/checkout@v6

      - name: Build image (local-only tags)
        if: ${{ !startsWith(inputs.image, 'xtmone/') }}
        working-directory: backend/sandbox
        env:
          IMAGE: ${{ inputs.image }}
        # build-image.sh already reports the exact failure (unknown tag vs. a
        # real build error) on its own stderr; a step failure surfaces that
        # directly instead of masking it behind a generic message here.
        run: ./build-image.sh "$IMAGE"

      - name: Pull image (Docker-Hub-published tags)
        if: ${{ startsWith(inputs.image, 'xtmone/') }}
        env:
          IMAGE: ${{ inputs.image }}
        run: docker pull "$IMAGE"

      - name: Scan with Trivy (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}
          format: json
          output: trivy-results.json
          exit-code: "0"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"

      - name: Convert Trivy results to SARIF (for artifact upload)
        # Converts the JSON report already produced above instead of
        # running a second full Trivy scan of the same image just for a
        # different output format — roughly halves this job's runtime on
        # the big -data/-malware images.
        run: trivy convert --format sarif --output trivy-results.sarif trivy-results.json

      - name: Render Trivy results as a table (step log)
        run: trivy convert --format table trivy-results.json

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results-${{ github.run_id }}
          path: trivy-results.sarif
          retention-days: 30
