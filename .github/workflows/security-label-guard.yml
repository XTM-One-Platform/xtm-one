name: Security label guard

# Removes the retired `security` label from any issue or pull request
# (dev-docs/reference/security-reporting.md). Every run looks the same - a fixed
# name, a job that always runs, no comment or output naming the item - so neither
# the item nor the run list points at what was labeled. pull_request_target is
# safe here: nothing of the pull request is checked out or run.
run-name: Security label guard

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  remove-label:
    name: Remove the label
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove the label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        run: |
          set -u
          # Label names are case-insensitive: `Security` too.
          [ "$(printf '%s' "$LABEL" | tr '[:upper:]' '[:lower:]')" = security ] || exit 0
          # A label someone removed meanwhile answers 404: nothing left to do.
          if ! out=$(gh api -X DELETE "repos/${REPO}/issues/${NUMBER}/labels/$(jq -rn --arg l "$LABEL" '$l|@uri')" 2>&1); then
            case "$out" in *"HTTP 404"*) exit 0 ;; *) echo "$out" >&2; exit 1 ;; esac
          fi
