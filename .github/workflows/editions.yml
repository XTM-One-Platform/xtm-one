name: Editions

# Which files are Enterprise Edition (dev-docs/reference/editions.md), checked in
# seconds: every file is classified (licensing/editions.yml, or the CE marker in
# a mixed directory) and every EE file carries its header. The classification is mechanical: no label and no review
# is asked for (the code owner approval gate was removed, CEO decision,
# 13 Nov 2026).

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  editions:
    name: Editions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.26"

      - name: Every file is classified and carries its header
        run: uv run --quiet --no-project --python ">=3.13" --with "pyyaml==6.0.3" python backend/scripts/license_headers.py --check
