name: Check Signed Commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-signed-commits:
    name: Check signed commits
    runs-on: ubuntu-26.04

    steps:
      - name: Check signed commits in PR
        uses: FiligranHQ/filigran-ci-tools/actions/check-signed-commit@19fa4ec83de78d2d1acd621b61c5f585edde3edf # main
