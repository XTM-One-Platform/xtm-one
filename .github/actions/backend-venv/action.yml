name: Backend venv
description: >-
  Python 3.14, uv and backend/.venv (dev group included), first on the PATH of
  the job's later steps. uv installs the locked dependencies in seconds where
  pip took over a minute. Only main saves the wheel cache: an entry another
  ref saves is readable by that ref alone, and the repository's cache quota is
  shared by every workflow (the runner builds need most of it).
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.11.26"
        enable-cache: true
        cache-dependency-glob: backend/uv.lock
        save-cache: ${{ github.ref == 'refs/heads/main' }}

    - uses: ./.github/actions/uv-sync
      with:
        directory: backend
