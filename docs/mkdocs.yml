site_name: XTM One Documentation
site_description: Documentation for XTM One, Filigran's AI-native threat-informed defense platform.
site_author: Filigran
site_url: https://xtm-one-platform.github.io/xtm-one/
copyright: © 2026 Filigran SAS. Community Edition licensed under the Apache License 2.0
repo_name: GitHub
repo_url: https://github.com/XTM-One-Platform/xtm-one
edit_uri: https://github.com/XTM-One-Platform/xtm-one/blob/main/docs/docs/

# Theming
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  features:
    - navigation.tabs
    - navigation.path
    - navigation.footer
    - navigation.expand
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - search.highlight
  palette:
    scheme: filigran
  font:
    text: IBM Plex Sans
    code: Roboto Mono

# CSS
extra_css:
  - assets/css/custom.css

# Extra
extra:
  version:
    provider: mike
  analytics:
    provider: google
    property: G-P8K1S4VSXR
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/XTM-One-Platform
    - icon: fontawesome/brands/slack
      link: https://community.filigran.io
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/company/filigran
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/FiligranHQ

# Plugins
plugins:
  - mike:
      alias_type: symlink
      canonical_version: latest
  - search
  - git-committers:
      # Reads page contributors from the GitHub API with the token in
      # MKDOCS_GIT_COMMITTERS_APIKEY (CI passes GITHUB_TOKEN). Without one,
      # hooks/git_committers.py switches the plugin off; so does
      # MKDOCS_GIT_COMMITTERS_ENABLED=false. A failed REST call is logged as an
      # error and a GraphQL error as a warning, both failing `--strict`; a
      # connection error aborts the build. The docs workflows then build again
      # without the contributors (see README.md).
      enabled: !ENV [MKDOCS_GIT_COMMITTERS_ENABLED, true]
      repository: XTM-One-Platform/xtm-one
      branch: main
      # docs_dir seen from the repository root: the plugin prefixes each page
      # with it for its `git log` and its GitHub API query.
      docs_path: docs/docs/
      # People only. web-flow is GitHub's merge identity, the committer of
      # every pull request merged on github.com; claude and Copilot are the AI
      # co-authors GitHub resolves from `Co-authored-by` trailers. To hide
      # another bot, add its login as GitHub spells it (the avatar tooltip
      # without the @, e.g. dependabot[bot]): the match is exact, case
      # included. Editing this file changes the docs workflows' cache key, so
      # their next builds fetch every page again with the new list.
      exclude_committers:
        - web-flow
        - claude
        - Copilot
      # Relative to docs/ (where mkdocs runs), git-ignored and outside the
      # built site. The docs workflows keep it between runs; their cache key
      # hashes this file and uv.lock because a cached page keeps the
      # list it was fetched with, whatever the settings above say now.
      cache_dir: .cache/plugin/git-committers
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - glightbox

# Build hooks, relative to this file. git_committers.py: no GitHub token, no
# contributors section; logins only in the contributors list.
hooks:
  - hooks/git_committers.py

# Extensions
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - def_list
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.smartsymbols
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.betterem
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: false
      auto_title: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      url_download: true

# Unpublished pages (built neither into the site nor into the search index).
# The *visual flow builder* sits behind the `FLOW_BUILDER` feature flag while it
# is not announced externally, so its pages must not be reachable by URL either
# — dropping them from `nav` alone leaves them built and indexed. The files stay
# in the repository: they are the documentation to republish (add the two nav
# entries back under `Work with agents`, after `Agentic flow`) the day the
# feature ships. See `dev-docs/flow-builder-feature-flag.md`.
#
# `usage/agentic-flow.md` is deliberately NOT here: it documents the global
# handover graph and its focus field — the Agent-to-Agent Live Map, which
# predates the builder and stays live.
#
# *Evaluation* sits behind the `EVALUATION` feature flag and is never offered in
# XTM One mode, so its page is unpublished the same way; republish it
# (add `Evaluations: administration/evaluations.md` back to `Administration`,
# after `Prompt safety (Nova)`) when the flag is removed. See
# `dev-docs/evaluation-feature-flag.md`.
exclude_docs: |
  usage/flows.md
  usage/flows-api.md
  administration/evaluations.md

