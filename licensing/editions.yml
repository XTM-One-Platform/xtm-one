# Which source files belong to the XTM One Enterprise Edition (EE).
#
# The rule (#5493): everything agentic is EE, Knowledge Bases included; the
# modules of the Platform MCP Servers (/mcp/opencti, /mcp/openaev, /mcp/opencrq)
# stay Community Edition (CE), although they import EE files at run time. A file matched by no `ee` glob is CE,
# as LICENSE states ("If no such header is provided, this means that the file
# is belonging to the Community Edition").
#
# Globs are relative to the repository root, `**` spans directories. A file is
# EE when an `ee` glob matches it and no `except` glob does. Each EE source file
# (.py, .ts, .tsx, .js, .mjs, .rs, .css, .sh, .ps1) not matched by `no_header` carries the header that
# `backend/scripts/license_headers.py` builds from the "XTM One Enterprise
# Edition License" section of LICENSE; a `<dir>/**` glob with no `except` entry
# under it also gets `<dir>/copyright.md`, which covers the files a comment
# cannot mark (manifests, data, assets). A `third_party` file is
# neither EE nor CE: it keeps the license of its owner, and the `copyright.md`
# of its directory names it. A package manifest under an `ee` glob declares the
# EE license (`LicenseRef-XTM-One-Enterprise-Edition`).
#
# Contract: dev-docs/reference/editions.md.

