# Nothing becomes CE without a decision (#5493): a file matched by no `ee` glob
# is CE, and CE cannot become EE once a version holds it under Apache. So each
# directory is decided once: wholly EE (a `<dir>/**` glob above), wholly CE
# (`ce`: every file under it, in its child directories too) or mixed (`mixed`).
# In a mixed directory each source file is classified (an `ee` glob, or the CE
# marker `SPDX-License-Identifier: Apache-2.0` on its first line) and each child
# directory too (`ee`, `ce` or `mixed`). The trees the list covers are mixed. The tripwire fails on a new
# directory or file that is not classified, on an entry that names nothing, and
# on a `ce` directory that holds an EE file.
mixed:
  - apps
  - backend/app
  - backend/app/api
  - backend/app/api/v1
