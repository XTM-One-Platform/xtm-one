<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Synthetic slide background (dev fixture)">
  <!-- Synthetic dev fixture: a flat gradient plus a grid, sized to a 16:9 slide. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09101e"/>
      <stop offset="100%" stop-color="#0f1e38"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 L0 0 0 80" fill="none" stroke="#0fbcff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <circle cx="1120" cy="120" r="180" fill="#0fbcff" fill-opacity="0.06"/>
</svg>
